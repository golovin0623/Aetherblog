<!DOCTYPE html>
<!--
    THIS IS A TEMPLATE THAT SHOULD BE USED EVERY TIME AND MODIFIED.
    WHAT TO KEEP:
    ✓ Overall structure (header, sidebar, main content)
    ✓ Anthropic branding (colors, fonts, layout)
    ✓ Seed navigation section (always include this)
    ✓ Self-contained artifact (everything inline)

    WHAT TO CREATIVELY EDIT:
    ✗ The p5.js algorithm (implement YOUR vision)
    ✗ The parameters (define what YOUR art needs)
    ✗ The UI controls (match YOUR parameters)

    Let your philosophy guide the implementation.
    The world is your oyster - be creative!
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonant Cartography — Music Cover Lab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <!-- Headers (CUSTOMIZE THIS FOR YOUR ART) -->
            <h1>Resonant Cartography</h1>
            <div class="subtitle">A seeded harmonic field for reproducible music and playlist covers.</div>

            <!-- Seed Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section (CUSTOMIZE THIS FOR YOUR ART) -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Particle Density</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="600" max="4200" step="200" value="2200" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">2200</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Harmonic Orbits</label>
                    <div class="slider-container">
                        <input type="range" id="orbitCount" min="4" max="18" step="1" value="9" oninput="updateParam('orbitCount', this.value)">
                        <span class="value-display" id="orbitCount-value">9</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Field Turbulence</label>
                    <div class="slider-container">
                        <input type="range" id="turbulence" min="0.1" max="1.8" step="0.1" value="0.8" oninput="updateParam('turbulence', this.value)">
                        <span class="value-display" id="turbulence-value">0.8</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Resonance Strength</label>
                    <div class="slider-container">
                        <input type="range" id="fieldStrength" min="0.4" max="2.2" step="0.1" value="1.2" oninput="updateParam('fieldStrength', this.value)">
                        <span class="value-display" id="fieldStrength-value">1.2</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Atmospheric Fade</label>
                    <div class="slider-container">
                        <input type="range" id="trailFade" min="2" max="24" step="1" value="8" oninput="updateParam('trailFade', this.value)">
                        <span class="value-display" id="trailFade-value">8</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section (OPTIONAL - CUSTOMIZE OR REMOVE) -->
            <div class="control-section">
                <h3>Colors</h3>

                <!-- Color 1 -->
                <div class="color-group">
                    <label>Primary Color</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#ec496f" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#ec496f</span>
                    </div>
                </div>

                <!-- Color 2 -->
                <div class="color-group">
                    <label>Secondary Color</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#4cc9d8" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#4cc9d8</span>
                    </div>
                </div>

                <!-- Color 3 -->
                <div class="color-group">
                    <label>Accent Color</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#7868e6" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#7868e6</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="regenerateArtwork()">Regenerate</button>
                    <button class="button secondary" onclick="resetParameters()">Reset</button>
                </div>
                <button class="button tertiary" style="margin-top: 8px" onclick="downloadArtwork()">Download PNG</button>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // GENERATIVE ART PARAMETERS - CUSTOMIZE FOR YOUR ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            particleCount: 2200,
            orbitCount: 9,
            turbulence: 0.8,
            fieldStrength: 1.2,
            trailFade: 8,
            colorPalette: ['#ec496f', '#4cc9d8', '#7868e6']
        };

        let defaultParams = JSON.parse(JSON.stringify(params));
        let particles = [];
        let resonanceCenter;
        let phase = 0;
        let renderFrame = 0;
        const maxRenderFrames = 420;

        function setup() {
            const canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            pixelDensity(1);
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            resonanceCenter = createVector(
                width * random(0.38, 0.62),
                height * random(0.34, 0.58)
            );
            phase = random(TWO_PI);
            renderFrame = 0;
            particles = Array.from({ length: params.particleCount }, (_, index) => new ResonanceParticle(index));
            background('#111318');
            drawRestField();
            loop();
        }

        function drawRestField() {
            noFill();
            strokeWeight(1);
            for (let i = 1; i <= params.orbitCount; i++) {
                const radius = map(i, 1, params.orbitCount, 80, width * 0.58);
                const alpha = map(i, 1, params.orbitCount, 34, 7);
                stroke(255, 255, 255, alpha);
                beginShape();
                for (let a = 0; a <= TWO_PI + 0.08; a += 0.08) {
                    const warp = noise(i * 0.23, cos(a) * 0.7 + 8, sin(a) * 0.7 + 8) - 0.5;
                    const r = radius + warp * 42 * params.turbulence;
                    vertex(resonanceCenter.x + cos(a) * r, resonanceCenter.y + sin(a) * r * 0.93);
                }
                endShape();
            }
        }

        function draw() {
            if (renderFrame >= maxRenderFrames) {
                noLoop();
                return;
            }

            noStroke();
            fill(17, 19, 24, params.trailFade);
            rect(0, 0, width, height);
            blendMode(ADD);
            for (const particle of particles) particle.step();
            blendMode(BLEND);
            renderFrame += 1;
        }

        class ResonanceParticle {
            constructor(index) {
                this.index = index;
                this.reset(true);
            }

            reset(initial = false) {
                const orbit = 1 + floor(random(params.orbitCount));
                const baseRadius = map(orbit, 1, params.orbitCount, 70, width * 0.57);
                const angle = random(TWO_PI);
                const spread = randomGaussian(0, 20 + orbit * 2.2);
                this.position = createVector(
                    resonanceCenter.x + cos(angle) * (baseRadius + spread),
                    resonanceCenter.y + sin(angle) * (baseRadius + spread) * 0.93
                );
                this.previous = this.position.copy();
                this.velocity = p5.Vector.fromAngle(random(TWO_PI)).mult(random(0.15, 0.75));
                this.life = initial ? floor(random(80, 460)) : floor(random(260, 520));
                this.energy = random(0.35, 1);
                this.paletteIndex = (orbit + this.index) % params.colorPalette.length;
            }

            step() {
                this.previous.set(this.position);
                const dx = this.position.x - resonanceCenter.x;
                const dy = (this.position.y - resonanceCenter.y) / 0.93;
                const radius = max(1, sqrt(dx * dx + dy * dy));
                const angle = atan2(dy, dx);
                const orbitPhase = radius * 0.018 + angle * params.orbitCount + phase;
                const interference = sin(orbitPhase) * 0.52 + cos(orbitPhase * 0.43) * 0.28;
                const n = noise(
                    this.position.x * 0.0018 * params.turbulence,
                    this.position.y * 0.0018 * params.turbulence,
                    params.seed * 0.0001 + renderFrame * 0.002
                );
                const tangent = angle + HALF_PI + (n - 0.5) * 1.9 * params.turbulence;
                const radial = interference * 0.34;
                const force = p5.Vector.fromAngle(tangent).mult(params.fieldStrength * (0.32 + this.energy));
                force.add(p5.Vector.fromAngle(angle).mult(radial));
                this.velocity.mult(0.91).add(force).limit(2.8 + params.fieldStrength);
                this.position.add(this.velocity);

                const colorA = color(params.colorPalette[this.paletteIndex]);
                const colorB = color(params.colorPalette[(this.paletteIndex + 1) % params.colorPalette.length]);
                const ink = lerpColor(colorA, colorB, constrain(n + interference * 0.18, 0, 1));
                const alpha = map(this.energy, 0.35, 1, 11, 33);
                stroke(red(ink), green(ink), blue(ink), alpha);
                strokeWeight(map(this.energy, 0.35, 1, 0.45, 1.25));
                line(this.previous.x, this.previous.y, this.position.x, this.position.y);

                this.life -= 1;
                const margin = 90;
                if (
                    this.life <= 0 ||
                    this.position.x < -margin || this.position.x > width + margin ||
                    this.position.y < -margin || this.position.y > height + margin
                ) this.reset();
            }
        }

        function updateParam(paramName, value) {
            const numericValue = Number(value);
            params[paramName] = numericValue;
            document.getElementById(`${paramName}-value`).textContent = numericValue;
            initializeSystem();
        }

        function updateColor(colorId, value) {
            const colorIndex = Number(colorId.replace('color', '')) - 1;
            params.colorPalette[colorIndex] = value;
            document.getElementById(`${colorId}-value`).textContent = value;
            initializeSystem();
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            const input = document.getElementById('seed-input');
            const newSeed = parseInt(input.value, 10);
            if (Number.isFinite(newSeed) && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed += 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function regenerateArtwork() {
            initializeSystem();
        }

        function downloadArtwork() {
            saveCanvas(`resonant-cartography-${params.seed}`, 'png');
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            for (const key of ['particleCount', 'orbitCount', 'turbulence', 'fieldStrength', 'trailFade']) {
                document.getElementById(key).value = params[key];
                document.getElementById(`${key}-value`).textContent = params[key];
            }
            params.colorPalette.forEach((value, index) => {
                const id = `color${index + 1}`;
                document.getElementById(id).value = value;
                document.getElementById(`${id}-value`).textContent = value;
            });
            updateSeedDisplay();
            initializeSystem();
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
