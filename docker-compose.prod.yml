# =============================================================================
# AetherBlog 生产环境 Docker Compose
# =============================================================================
# 
# 使用方法 (本地构建):
#   docker-compose -f docker-compose.prod.yml up -d --build
#
# 使用方法 (从 Docker Hub 拉取):
#   DOCKER_REGISTRY=golovin0623 docker-compose -f docker-compose.prod.yml up -d
#
# 端口映射:
#   - 7899: 统一入口网关 (Nginx) ← 推荐使用此端口访问
#   - 7893: 博客前端直接访问 (可选)
#   - 7894: 管理后台直接访问 (可选)
#   - 7895: PostgreSQL
#
# 访问方式:
#   - 博客: http://yourdomain:7896/
#   - 后台: http://yourdomain:7896/admin
#   - API:  http://yourdomain:7896/api
#
# =============================================================================

name: aetherblog

services:

  # ---------------------------------------------------------------------------
  # Gateway (统一入口)
  # ---------------------------------------------------------------------------
  
  gateway:
    image: nginx:alpine
    container_name: aetherblog-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-7899}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
    depends_on:
      - blog
      - admin
      - backend
      - ai-service
    networks:
      - aetherblog-network
    # SECURITY (VULN-123): 运行时加固 —— 禁止权限提升，除显式需要的能力外
    # 全部 drop，禁止写入根文件系统，仅允许写入指定的 tmpfs 路径。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE  # 绑定 :80 所必需
    read_only: true
    tmpfs:
      - /tmp:rw,size=16M,mode=1777
      - /var/cache/nginx:rw,size=16M,mode=0755
      - /var/run:rw,size=4M,mode=0755
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  # ---------------------------------------------------------------------------
  # 数据库服务
  # ---------------------------------------------------------------------------
  
  # PostgreSQL 17 with pgvector (AI功能必需)
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aetherblog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aetherblog
      POSTGRES_USER: aetherblog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}
    ports:
      # VULN-122 回退：恢复对外端口暴露以支持远程 DBA / 跨主机访问。
      # 运维侧必须通过 host 防火墙 + pg_hba.conf 限制来源 IP；若部署拓扑是
      # 单机自用，推荐改为 "127.0.0.1:${POSTGRES_PORT:-7895}:5432"。
      - "${POSTGRES_PORT:-7895}:5432"
    volumes:
      - aetherblog_postgres_data:/var/lib/postgresql/data
    networks:
      - aetherblog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetherblog -d aetherblog"]
      interval: 3s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis (可选，添加 --profile with-redis 启动内置 Redis)
  # 如果使用外部 Redis，设置 REDIS_HOST 和 REDIS_PORT 环境变量
  redis:
    image: redis:7.2-alpine
    container_name: aetherblog-redis
    restart: unless-stopped
    # SECURITY (VULN-119): REDIS_PASSWORD 必填。旧版 sh -c 条件 fallback 让
    # 未设密码时无认证启动，任何可达容器网络的组件都能读取 cache / rate-limit
    # key / session blob。单行 `redis-server --requirepass $REDIS_PASSWORD`
    # 由 compose 变量替换注入，无需 sh wrapper。
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD env var is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD env var is required}
    profiles:
      - with-redis
    ports:
      # VULN-122 回退：Redis 仍设 requirepass，外部访问者须持密码；网络隔离
      # 交给 host 防火墙。若单机自用，推荐改为 "127.0.0.1:${REDIS_PORT:-6379}:6379"。
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - aetherblog-network
    healthcheck:
      # SECURITY (VULN-147): 使用 REDISCLI_AUTH 环境变量替代 -a 参数。
      # -a 参数会把密码泄露到 `ps auxf` 输出；REDISCLI_AUTH 由 redis-cli 内部
      # 消费，不会出现在进程参数列表里。
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M


  # ---------------------------------------------------------------------------
  # 容器监控代理（可选，opt-in via --profile with-monitor）
  # ---------------------------------------------------------------------------
  #
  # 启用：
  #   docker-compose -f docker-compose.prod.yml --profile with-monitor up -d
  # 同时在 .env 设：
  #   DOCKER_SOCKET_PROXY_URL=http://docker-socket-proxy:2375
  #
  # 安全模型：tecnativa/docker-socket-proxy 在 backend 与 Docker daemon 之间
  # 充当只读白名单。下面的环境变量把 API 表面收紧到容器监控所需的最小权限：
  # GET /containers/json + GET /containers/*/stats，其余全部拒绝。POST=0
  # 杜绝 exec/启停容器；attribute 类的元数据保留以便 UI 渲染镜像/状态/标签。
  # 仍需保护 host：容器自身仅有 docker.sock 的 :ro 挂载，不挂任何宿主目录。

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: aetherblog-docker-socket-proxy
    restart: unless-stopped
    profiles:
      - with-monitor
    environment:
      # 默认全部 0；只放开容器监控真正需要的 GET 子集
      CONTAINERS: 1
      INFO: 1
      # 显式声明禁用一切写操作（默认即 0，留作审计可见性）
      POST: 0
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      VOLUMES: 0
      IMAGES: 0
      NETWORKS: 0
      SYSTEM: 0
      AUTH: 0
      SECRETS: 0
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      NODES: 0
      PLUGINS: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    networks:
      - aetherblog-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 仅保留 user-switch 三件套用于 haproxy drop privileges。2375 是非特权端口
      # (>1024)，无需 NET_BIND_SERVICE。
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /run:rw,size=4M,mode=0755
      - /tmp:rw,size=4M,mode=1777
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M

  # ---------------------------------------------------------------------------
  # 应用服务
  # ---------------------------------------------------------------------------

  backend:
    image: ${DOCKER_REGISTRY:-}${DOCKER_REGISTRY:+/}aetherblog-backend:${VERSION:-latest}
    build:
      context: .
      dockerfile: apps/server-go/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: aetherblog-backend
    restart: unless-stopped
    expose:
      - "8080"
    # 注意: 不暴露 8080 到宿主机，仅通过 Docker 内部网络访问
    # 如需直接访问后端，可启用下面的配置:
    # ports:
    #   - "127.0.0.1:8081:8080"
    environment:
      AETHERBLOG_DATABASE_HOST: postgres
      AETHERBLOG_DATABASE_PORT: 5432
      AETHERBLOG_DATABASE_USER: aetherblog
      AETHERBLOG_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}
      AETHERBLOG_DATABASE_DBNAME: aetherblog
      AETHERBLOG_DATABASE_SSLMODE: disable
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AETHERBLOG_AI_BASE_URL: http://ai-service:8000
      AETHERBLOG_AI_INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:?AI_INTERNAL_SERVICE_TOKEN env var is required}
      AETHERBLOG_AI_STREAM_READ_TIMEOUT: ${AETHERBLOG_AI_STREAM_READ_TIMEOUT:-30m}
      # SECURITY (VULN-120): JWT_SECRET 必填，禁止空值静默回退。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env var is required (min 32 chars)}
      AETHERBLOG_AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AETHERBLOG_AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Strict}
      AETHERBLOG_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:7899,http://127.0.0.1:7899}
      AETHERBLOG_UPLOAD_PATH: /app/uploads
      AETHERBLOG_LOG_PATH: /app/logs
      # 默认 info,可在 .env 里覆盖。运行时也可经 PUT /v1/admin/system/log-level
      # 临时调整(进程重启回到这里的值)。
      AETHERBLOG_LOG_LEVEL: ${AETHERBLOG_LOG_LEVEL:-info}
      # 容器监控（admin "容器监控" 面板）—— 仅当用 `--profile with-monitor`
      # 启动时下面的 docker-socket-proxy 服务才会拉起，此 URL 才连得通。
      # 默认部署不带该 profile：变量保持空字符串，backend 走默认 socket 路径
      # 时也找不到（容器里没挂），UI 会显示"Docker API 不可用"——这是预期行为。
      DOCKER_SOCKET_PROXY_URL: ${DOCKER_SOCKET_PROXY_URL:-}
    volumes:
      - aetherblog_uploads:/app/uploads
      - aetherblog_logs:/app/logs
      # 不再 bind-mount /var/run/docker.sock —— 即便 :ro 仍授予宿主 root 等价
      # 权限。容器监控通过下面的 docker-socket-proxy 服务（with-monitor profile）
      # 暴露受限只读 API，而非直挂 socket。
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aetherblog-network
    # SECURITY (VULN-123): Go 后端仅写入 /app/uploads 和 /app/logs，
    # 这两处都已挂到具名卷。根文件系统只读可以防止漏洞被利用后向 / 落下
    # 持久化的恶意二进制。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,size=32M,mode=1777
    healthcheck:
      test: ["CMD", "/app/server", "-health"]
      interval: 3s
      timeout: 3s
      retries: 3
      # SECURITY (VULN-150): 给应用足够的真正启动时间，再让 healthcheck 报失败；
      # 此前的 1s 会把崩溃循环掩盖成"暂时还健康"。
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  ai-service:
    image: ${DOCKER_REGISTRY:-}${DOCKER_REGISTRY:+/}aetherblog-ai-service:${VERSION:-latest}
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: aetherblog-ai-service
    restart: unless-stopped
    expose:
      - "8000"
    # 注意: 不暴露 8000 到宿主机，仅通过 Docker 内部网络访问
    environment:
      AI_ENV: prod
      AI_HOST: 0.0.0.0
      AI_PORT: 8000
      # 运行时也可经 PUT /v1/admin/system/log-level (Go 后端转发) 临时调整。
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-info}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-false}
      AI_JWT_MODE: ${AI_JWT_MODE:-HMAC}
      # SECURITY (VULN-120): JWT_SECRET 必填，禁止空值静默回退。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env var is required (min 32 chars)}  # AI 服务与后端共用同一个密钥
      AI_JWT_JWKS_URL: ${AI_JWT_JWKS_URL:-}
      AI_JWT_ISSUER: ${AI_JWT_ISSUER:-}
      AI_JWT_AUDIENCE: ${AI_JWT_AUDIENCE:-}
      AI_INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:?AI_INTERNAL_SERVICE_TOKEN env var is required}
      # SECURITY (VULN-056): 凭据加密密钥 —— 必须独立于 JWT_SECRET。
      AI_CREDENTIAL_ENCRYPTION_KEYS: ${AI_CREDENTIAL_ENCRYPTION_KEYS:?AI_CREDENTIAL_ENCRYPTION_KEYS env var is required}
      # 对齐 Go backend 的三段式 Redis 配置,避免 ai-service 只认 REDIS_URL
      # 时出现 "backend 连得上但 ai-service 连不上" 的运维漂移。常见坑:
      # Redis 容器内部端口 6379 + 宿主机映射到 6999, backend 走宿主机 IP + 6999
      # OK, 但 ai-service 如果只读 REDIS_URL 就容易拼出 redis:6999 这种永远
      # 不通的组合 —— 三段式配置让两边同步, 由 Python 侧合成 URL。
      # ai-service: app/core/config.py::_build_redis_url_from_parts
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 可选的完整 URL 覆盖。外部 Redis cluster / rediss:// TLS / sentinel
      # 场景下可以直接写完整 URL，此时三段式变量被忽略 (_build_redis_url_from_parts
      # 检测到非空 REDIS_URL 就短路返回)。
      REDIS_URL: ${AI_REDIS_URL:-}
      POSTGRES_DSN: postgresql://aetherblog:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}@postgres:5432/aetherblog
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      AI_LOG_PATH: /app/logs
    volumes:
      - aetherblog_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aetherblog-network
    # SECURITY (VULN-123): 与 Go 后端相同的加固策略。Python 需要 /tmp 用作
    # 临时缓冲区（这里没有启用 uvicorn reload；标准 tmpfs 大小已足够支撑
    # 日志/编译缓存）。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,size=64M,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      # start_period 给 ai-service 足够的冷启动窗口：Python 导入 litellm/asyncpg/
      # pgvector + FastAPI lifespan 里 asyncpg.create_pool(min_size=1) 首连 +
      # jwt_keys.start_refresher 的首次 DB 拉取，整段耗时在慢机上可超过 30s。
      # 该窗口内探活失败不计入 retries，避免 CI 部署 preflight 看到 docker=starting。
      # interval 从 30s 缩到 10s，让进程真正起来后 docker 能更快翻成 healthy。
      start_period: 45s
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  blog:
    image: ${DOCKER_REGISTRY:-}${DOCKER_REGISTRY:+/}aetherblog-blog:${VERSION:-latest}
    build:
      context: .
      dockerfile: apps/blog/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        # SECURITY (VULN-144): 打包成相对路径 `/api` —— 生产网关已经把 /api
        # 代理到后端，客户端永远看不到内部主机名。如果把 `http://backend:8080`
        # 烤进打包产物，就会把这个内部 DNS 名暴露给每位访客的浏览器
        # (既泄露拓扑，又会在客户端 DNS 不同时引发混乱)。
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_ADMIN_URL: /admin/
    container_name: aetherblog-blog
    restart: unless-stopped
    ports:
      # VULN-122 回退：允许外部直连博客端口（用于独立域名直挂 / CDN 源站）。
      # 生产推荐仅暴露网关，此端口仅为 fallback。
      - "${BLOG_PORT:-7893}:3000"
    expose:
      - "3000"
    environment:
      API_URL: http://backend:8080
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aetherblog-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  admin:
    image: ${DOCKER_REGISTRY:-}${DOCKER_REGISTRY:+/}aetherblog-admin:${VERSION:-latest}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: aetherblog-admin
    restart: unless-stopped
    ports:
      # VULN-122 回退：允许外部直连 admin 端口（独立域名 / 内网管理直达）。
      # VULN-124 保留：容器侧仍用 unprivileged nginx:8080。
      - "${ADMIN_PORT:-7894}:8080"
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aetherblog-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

# ---------------------------------------------------------------------------
# 数据卷
# ---------------------------------------------------------------------------

volumes:
  aetherblog_postgres_data:
    name: aetherblog_postgres_data

  aetherblog_uploads:
    name: aetherblog_uploads
  aetherblog_logs:
    name: aetherblog_logs

# ---------------------------------------------------------------------------
# 网络
# ---------------------------------------------------------------------------

networks:
  aetherblog-network:
    driver: bridge
