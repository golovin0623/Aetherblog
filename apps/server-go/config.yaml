# =============================================================================
# AetherBlog 开发环境配置
# =============================================================================
# 警告：本文件仅包含开发环境默认值。
# 在生产环境中，所有敏感值必须通过环境变量设置：
#   - JWT_SECRET（必填，至少 32 个字符）
#   - ETHERBLOG_DATABASE_PASSWORD
#   - REDIS_密码
# 切勿在生产部署中直接使用此处的值。
# =============================================================================

server:
  port: 8080
  host: "0.0.0.0"

database:
  host: localhost
  port: 5432
  user: aetherblog
  password: aetherblog123
  dbname: aetherblog
  sslmode: disable  # 仅限开发环境 —— 生产环境应设置 AETHERBLOG_DATABASE_SSLMODE=require
  max_open_conns: 20
  max_idle_conns: 5

redis:
  host: localhost
  port: 6379
  password: "aetherblog_dev"
  db: 0

jwt:
  # secret: ""  # 必填：通过 JWT_SECRET 环境变量设置（至少 32 个字符）
  expiration: 24h
  refresh_expiration: 168h  # 7 天

auth:
  cookie:
    secure: false
    same_site: Strict

cors:
  allowed_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:7894
    - http://127.0.0.1:7894
    - http://localhost:7899
    - http://127.0.0.1:7899

upload:
  path: ./uploads
  url_prefix: /uploads

media:
  trash_cleanup_days: 120

log:
  path: ./logs
  level: debug

ai:
  base_url: http://localhost:8000
  connect_timeout: 5s
  read_timeout: 30s
  stream_read_timeout: 5m

elasticsearch:
  uris:
    - http://localhost:9200
