<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0f'/%3E%3Cpath d='M32 11 52 53H41l-3.5-8.5h-11L23 53H12L32 11Zm1 18-3.8 9.2h7.6L33 29Z' fill='%23f5f2ea'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AetherBlog Admin</title>
    <!-- 跟随主题的 theme-color —— 移动端浏览器顶栏/状态栏避免白闪 -->
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
    <!--
      内联 FOUC 防护 —— 必须在外部 CSS 之前，否则从博客(Next.js dark)跳转到
      admin(Vite)的瞬间，外部 CSS 还没解析完，浏览器会用默认白底绘制首帧。
      tokens 里 --bg-primary: light=#FAF9F6 / dark=#0a0a0f，这里把同样的值写成内联规则，
      配合下方主题初始化脚本抢先在 <html> 上加 .dark/.light，首帧就直接上色。

      真相源 (Single Source of Truth): packages/hooks/src/useTheme.tsx → themeFoucGuardStyle
      Blog 端通过 import 该常量消费；Admin 是静态 HTML 无法 import，改动时两处必须同步。
    -->
    <style>
      html { background-color: #0a0a0f; color-scheme: dark; }
      html.light { background-color: #FAF9F6; color-scheme: light; }
      html.dark { background-color: #0a0a0f; color-scheme: dark; }
      body { background-color: inherit; margin: 0; }
    </style>
    <!-- 主题初始化脚本 —— 在首帧绘制之前设置主题，防止 FOUC -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('aetherblog-theme');
          var isDark = theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(isDark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
