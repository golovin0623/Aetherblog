# 安全 (VULN-075): 显式的项目元数据钉住 Python 最低版本与打包身份。
# 没有 ``requires-python``,在 3.9 上新克隆的环境会安装不兼容的依赖
# (pydantic-settings 2.x、MultiFernet 轮换语法、基于 pattern 的 validator),
# 并在 import 阶段直接崩溃。
[project]
name = "aetherblog-ai-service"
version = "0.1.0"
description = "AetherBlog AI service — FastAPI + LiteLLM proxy and credential vault."
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
