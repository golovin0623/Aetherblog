name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

# 并发控制策略:
#   - PR: 同一 ref 上的旧运行被取消（节省 runner，反正会被新 push 覆盖）
#   - push to main/develop: 每次给独立 group，让 detect-changes / *-test /
#     frontend-quality / config-validate 等"检查类" job 在多次连续合并时
#     完全并行——之前所有 push 共享一个 group 导致后到的 push 整段排队。
#
# 部署阶段单独通过 job 级 `concurrency`（见 deploy job）串行化，避免:
#   1) 后部署的旧 commit 把更新的服务版本覆盖回去
#   2) 不能 cancel-in-progress: 各 push 触发的 detect-changes 结果不同
#      （A 改 admin / B 改 blog / C 改 backend），跳过中间任何一次都会让
#      对应 service 永远拿不到新镜像
concurrency:
  group: >-
    ${{
      github.event_name == 'pull_request'
        && format('{0}-pr-{1}', github.workflow, github.ref)
        || format('{0}-push-{1}', github.workflow, github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# SECURITY (VULN-137): 工作流级权限默认收敛为只读。
# 需要写权限的单独 job（如 docker push、PR 评论）必须在本地重新声明所需权限。
# 防止被篡改的 Action 偷偷利用 GITHUB_TOKEN 默认的读写权限。
permissions:
  contents: read
  pull-requests: read

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_USERNAME || 'golovin0623' }}

jobs:
  # ===========================================================================
  # 变更检测: 最先运行，决定后续哪些 job 需要执行
  # ===========================================================================
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
      blog: ${{ steps.filter.outputs.blog }}
      admin: ${{ steps.filter.outputs.admin }}
      gateway: ${{ steps.filter.outputs.gateway }}
      ops_webhook: ${{ steps.filter.outputs.ops_webhook }}
      frontend: ${{ steps.check.outputs.frontend }}
      any_changed: ${{ steps.check.outputs.any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/server-go/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci-cd.yml'
            ai-service:
              - 'apps/ai-service/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci-cd.yml'
            blog:
              - 'apps/blog/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'docker-compose*.yml'
              - '.github/workflows/ci-cd.yml'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'docker-compose*.yml'
              - '.github/workflows/ci-cd.yml'
            gateway:
              - 'nginx/**'
              - 'docker-compose.prod.yml'
            ops_webhook:
              - 'ops/webhook/**'

      - name: Compute aggregate flags
        id: check
        run: |
          # 前端聚合标志: blog 或 admin 任一变更
          if [[ "${{ steps.filter.outputs.blog }}" == "true" || \
                "${{ steps.filter.outputs.admin }}" == "true" ]]; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

          # 任意模块变更标志 (含 ops/webhook —— 它的改动需要触发 deploy job
          # 走一遍 deploy.sh 的 trap EXIT 链路, 把新 webhook 代码 cp 到
          # /var/lib/aetherblog/webhook/ 副本并通过 path-unit + sentinel 完成
          # 自动 restart, 见 ops/webhook/README.md)
          if [[ "${{ steps.filter.outputs.backend }}" == "true" || \
                "${{ steps.filter.outputs.ai-service }}" == "true" || \
                "${{ steps.filter.outputs.blog }}" == "true" || \
                "${{ steps.filter.outputs.admin }}" == "true" || \
                "${{ steps.filter.outputs.gateway }}" == "true" || \
                "${{ steps.filter.outputs.ops_webhook }}" == "true" ]]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Print change detection results
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 变更检测结果:"
          echo "  backend:     ${{ steps.filter.outputs.backend }}"
          echo "  ai-service:  ${{ steps.filter.outputs.ai-service }}"
          echo "  blog:        ${{ steps.filter.outputs.blog }}"
          echo "  admin:       ${{ steps.filter.outputs.admin }}"
          echo "  gateway:     ${{ steps.filter.outputs.gateway }}"
          echo "  ops_webhook: ${{ steps.filter.outputs.ops_webhook }}"
          echo "  frontend:    ${{ steps.check.outputs.frontend }}"
          echo "  any_changed: ${{ steps.check.outputs.any_changed }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ===========================================================================
  # Gitleaks secret scanning (VULN-160): 阻止硬编码 secret/JWT 在 diff 中泄露
  # ===========================================================================
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks 需要全历史来扫每次 diff

      - name: Run gitleaks
        # TODO(supply-chain): 待 CI 基线稳定后将 @v2 替换为 40 位 SHA (VULN-136)。
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Trivy image scan (VULN-159): 镜像 CVE 扫描。仅在 main 分支构建后执行。
  # ===========================================================================
  trivy-scan:
    needs: [detect-changes, build-backend, build-ai-service, build-blog, build-admin]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # 写入 Security → Code scanning alerts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan backend image
        # TODO(supply-chain): 钉死到 SHA (VULN-136)。
        # v0.28.0 内嵌 setup-trivy@v0.2.1（已被上游删除 → "unable to find version"）；
        # v0.35.0 用 SHA 钉死 setup-trivy 不再受 tag 移动影响。
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/aetherblog-backend:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # 先作为观测，不阻断；稳定后改为 1

  # ===========================================================================
  # 密钥与默认值守门 (VULN-117): 阻止已知弱口令/Mock 密钥被提交到代码
  # ===========================================================================
  forbidden-defaults-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Block VERSION=latest in tracked env files
        # SECURITY (VULN-143): `latest` 标签会绕过 cosign 校验，让恶意推送
        # 静默落地。受版本控制的 .env 模板 / compose 文件必须钉死到 SemVer。
        run: |
          if grep -RnE '^VERSION=latest' --include='.env.example' --include='docker-compose*.yml' .; then
            echo "::error::VERSION=latest is forbidden in tracked config — pin to v\\d+\\.\\d+\\.\\d+"
            exit 1
          fi
          echo "✅ No VERSION=latest pinned in tracked env templates"

      - name: Block leaked secret markers
        run: |
          # 仅拦截当前运行时实际可用的弱密钥（VULN-117/121）。
          # 注意：`aetherblog123` 是历史 dev DB 默认值，散布在 docker-compose.yml /
          # Makefile / config.yaml / 旧 start.sh 内，将由 VULN-118 (P1) 清理；
          # 在那之前不要把它加入此 guard 否则 CI 长期红。
          if grep -RnE 'change-me-to-a-secure-random-string|sk-proj-mock-key-for-testing|default-secret-for-dev-only-change-in-prod' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv \
              --exclude-dir=dist --exclude-dir=.next --exclude-dir=__pycache__ \
              --exclude-dir=bin \
              --exclude='*.md' \
              --exclude='ci-cd.yml' \
              .; then
            echo "::error::Leaked default secret markers detected — replace with empty placeholders in .env.example."
            exit 1
          fi
          echo "✅ No production-grade default secrets present in tracked source"

  # ===========================================================================
  # Docker 配置验证 (与 detect-changes 并行)
  # ===========================================================================
  config-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Go migration versions
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          migration_dir = Path("apps/server-go/migrations")
          pattern = re.compile(r"^(\d{6})_.+\.(up|down)\.sql$")
          seen = {}
          duplicates = []

          for path in sorted(migration_dir.glob("*.sql")):
              match = pattern.match(path.name)
              if not match:
                  continue
              key = match.groups()
              if key in seen:
                  duplicates.append((key[0], key[1], seen[key], path))
              else:
                  seen[key] = path

          if duplicates:
              for version, direction, first, second in duplicates:
                  print(
                      f"::error file={second}::duplicate migration version "
                      f"{version}.{direction}; already used by {first}"
                  )
              sys.exit(1)

          print("✅ Go migration versions are unique")
          PY

      - name: Validate deployment runtime contracts
        run: python3 -m unittest discover -s ops/webhook -p 'test_*.py'

      - name: Validate Docker Compose files
        env:
          # VULN-117/118/119/120 给变量加了 `${VAR:?}` 强校验；CI 占位值必须
          # 覆盖所有新增的必填变量，否则 `config --quiet` 在 compose 渲染前就会失败。
          POSTGRES_PASSWORD: ci-validate-dummy
          DB_PASSWORD: ci-validate-dummy
          REDIS_PASSWORD: ci-validate-dummy
          JWT_SECRET: ci-validate-dummy
          AI_INTERNAL_SERVICE_TOKEN: ci-validate-dummy-token-minimum-32chars
          # VULN-056: 真实 Fernet 密钥（一次性生成）。必须能成功解码，不能只是
          # 32 字节的随机字符。
          AI_CREDENTIAL_ENCRYPTION_KEYS: RyzpKxpEEIQQfvVYPjcrwgOpmRtvhMhqsobGQHTr1WI=
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
          echo "✅ Docker Compose files are valid"

  # ===========================================================================
  # 前端质量检查: lint + typecheck (仅当前端代码变更时)
  # PR 阶段到此为止，不跑 build
  # ===========================================================================
  frontend-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        # SECURITY (VULN-138): PR 工作流加 --ignore-scripts 安装依赖，避免恶意
        # 依赖的 postinstall 钩子在 pull_request 运行时窃取 GITHUB_TOKEN / secrets。
        # 在 main push 上跑的 build job，如果某个原生扩展确实需要构建步骤，可以去掉这个 flag 重装。
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        # SECURITY (VULN-157): 暴露 high + critical 级别的 npm 安全公告。当前
        # 不阻断构建 —— CI 输出作为可见性信号，等存量公告处理完、确立干净基线后
        # 再切换为 `exit 1`。
        run: pnpm audit --audit-level=high || echo "::warning::pnpm audit reported issues (non-blocking)"

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: |
          pnpm --filter @aetherblog/admin typecheck
          pnpm --filter @aetherblog/blog typecheck

      - name: Unit tests (vitest)
        # 红线: 前端单测必须真正参与红绿判定 —— 不许加 `|| true` / continue-on-error。
        # (2026-08 之前本 job 只有 lint + typecheck, 数千行 vitest 用例从未在 CI 跑过。)
        #
        # `--if-present` 而非裸 `-r test`: blog / ui / hooks / types / utils / editor
        # 没有 test script, 裸 `-r test` 会因缺脚本整段失败。当前实际执行:
        #   @aetherblog/admin (vitest run) + @aetherblog/agent-kit (vitest run)
        # 新包只要在自己的 package.json 加 `"test": "vitest run"` 就会自动纳入。
        run: pnpm -r --if-present test

  # ===========================================================================
  # 后端测试 (仅当后端代码变更时)
  # ===========================================================================
  backend-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/server-go/go.sum

      - name: Build
        working-directory: apps/server-go
        run: go build ./...

      - name: Run tests
        working-directory: apps/server-go
        run: go test ./... -v -count=1

      - name: Go vulnerability check (govulncheck)
        # SECURITY (VULN-158): Go 官方漏洞库查询。当前不阻断 —— 已知漏洞仅
        # 告警，方便在 PR 运行中看到；待基线清理干净后切换为
        # `continue-on-error: false`。
        continue-on-error: true
        working-directory: apps/server-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./... || echo "::warning::govulncheck reported issues (non-blocking)"

  # ===========================================================================
  # AI 服务测试 (仅当 AI 服务代码变更时)
  # ===========================================================================
  ai-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.ai-service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            apps/ai-service/requirements.txt
            apps/ai-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/ai-service
        run: pip install -r requirements.txt

      - name: Python syntax check
        working-directory: apps/ai-service
        run: |
          python -m py_compile app/main.py
          find app -name "*.py" -exec python -m py_compile {} \;

      - name: Run linting
        # ruff 版本必须从 requirements-lint.txt 取(钉死的 ==),不要改回裸 `pip install ruff`:
        # 浮动版本会随上游发版改变「内置默认规则集」,曾在零代码变更下让 main 爆 507 条 error。
        # 规则集本身钉在 apps/ai-service/pyproject.toml 的 [tool.ruff.lint].select。
        working-directory: apps/ai-service
        run: |
          pip install -r requirements-lint.txt
          ruff check .

      - name: Verify app can start
        working-directory: apps/ai-service
        env:
          AI_ENV: test
          AI_MOCK_MODE: "true"
          JWT_SECRET: "ci-test-secret"
          AI_INTERNAL_SERVICE_TOKEN: "ci-test-token-minimum-32-characters-long"
          POSTGRES_DSN: "postgresql://test:test@localhost:5432/test_db"
          # VULN-056: AI 服务在没有设置加密密钥时拒绝启动。
          # 一次性生成命令: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
          AI_CREDENTIAL_ENCRYPTION_KEYS: "RyzpKxpEEIQQfvVYPjcrwgOpmRtvhMhqsobGQHTr1WI="
        run: |
          python -c "from app.main import app; print('✅ App imports successfully')"

      - name: Run unit tests (pytest)
        # 红线: pytest 必须真正参与红绿判定 —— 不许加 `|| true` / continue-on-error。
        # (2026-08 之前本 job 只有 py_compile + ruff + import 自检, tests/ 下的用例从未在 CI 跑过。)
        #
        # ⚠️ 本步骤刻意 **不** 复用上一步的 secret env。tests/conftest.py 用
        # `os.environ.setdefault` 兜底 JWT_SECRET / AI_INTERNAL_SERVICE_TOKEN /
        # AI_CREDENTIAL_ENCRYPTION_KEYS / POSTGRES_DSN，而 setdefault 不会覆盖
        # 外部已有值；tests/test_deps.py 又用字面量 "test-secret" 签 JWT。
        # 一旦在这里注入 JWT_SECRET=ci-test-secret，签名校验必然失败
        # （实测 4 个 test_deps 用例 401/断言失败）。让 conftest 自己兜底即可。
        #
        # --ignore=tests/e2e: e2e 依赖外部 provider / DB，不在单测门禁内。
        # 覆盖率门槛（--cov-fail-under=76）已写在 apps/ai-service/pyproject.toml
        # 的 [tool.pytest.ini_options].addopts，无需在此重复。
        working-directory: apps/ai-service
        env:
          AI_ENV: test
          AI_MOCK_MODE: "true"
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests --ignore=tests/e2e -q

  # ===========================================================================
  # 条件性 Docker 构建: 仅 push to main 且模块有变更时触发
  # ===========================================================================
  build-backend:
    needs: [detect-changes, backend-test]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.detect-changes.outputs.backend == 'true'
    # 同模块的多次 main push 串行 build——避免两个 build-backend 并行 push
    # `:latest` tag 时, 后完成的覆盖先完成的, 导致 deploy 拉到错误版本.
    # 不同模块 (backend/ai-service/blog/admin) 仍然跨 push 并行.
    concurrency:
      group: build-backend-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/aetherblog-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/server-go/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=backend
            type=registry,ref=${{ env.DOCKER_REGISTRY }}/aetherblog-backend:buildcache
          cache-to: |
            type=gha,scope=backend,mode=max
            type=registry,ref=${{ env.DOCKER_REGISTRY }}/aetherblog-backend:buildcache,mode=max
          platforms: linux/amd64

  build-ai-service:
    needs: [detect-changes, ai-test]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.detect-changes.outputs.ai-service == 'true'
    concurrency:
      group: build-ai-service-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/aetherblog-ai-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/ai-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=ai-service
            type=registry,ref=${{ env.DOCKER_REGISTRY }}/aetherblog-ai-service:buildcache
          cache-to: |
            type=gha,scope=ai-service,mode=max
            type=registry,ref=${{ env.DOCKER_REGISTRY }}/aetherblog-ai-service:buildcache,mode=max
          platforms: linux/amd64

  build-blog:
    needs: [detect-changes, frontend-quality]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.detect-changes.outputs.blog == 'true'
    concurrency:
      group: build-blog-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/aetherblog-blog
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/blog/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 双缓存策略: GHA 缓存用于 CI 增量构建加速, registry 缓存用于持久备份
          cache-from: |
            type=gha,scope=blog
            type=registry,ref=${{ env.DOCKER_REGISTRY }}/aetherblog-blog:buildcache
          cache-to: |
            type=gha,scope=blog,mode=max
            type=registry,ref=${{ env.DOCKER_REGISTRY }}/aetherblog-blog:buildcache,mode=max
          platforms: linux/amd64

  build-admin:
    needs: [detect-changes, frontend-quality]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.detect-changes.outputs.admin == 'true'
    concurrency:
      group: build-admin-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/aetherblog-admin
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/admin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=admin
            type=registry,ref=${{ env.DOCKER_REGISTRY }}/aetherblog-admin:buildcache
          cache-to: |
            type=gha,scope=admin,mode=max
            type=registry,ref=${{ env.DOCKER_REGISTRY }}/aetherblog-admin:buildcache,mode=max
          platforms: linux/amd64

  # ===========================================================================
  # 自动部署到服务器 (Webhook 触发)
  # ===========================================================================
  deploy:
    needs: [detect-changes, config-validate, build-backend, build-ai-service, build-blog, build-admin]
    # 即使部分 build job 被跳过也能运行，但至少有一个模块被构建才触发部署
    if: |
      always() &&
      (
        github.ref == 'refs/heads/main' && github.event_name == 'push' &&
        needs.detect-changes.outputs.any_changed == 'true'
      ) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    # 多个 main push 的 deploy 排队执行——按 commit 顺序逐个重启对应 service。
    # 不能 cancel-in-progress: 每个 push 的 detect-changes 结果不同（按模块拆分），
    # 跳掉中间任意一次会让该 push 改动的 service 永远拿不到新镜像。
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compute changed services
        id: services
        run: |
          SERVICES=""
          [[ "${{ needs.detect-changes.outputs.backend }}" == "true" ]] && SERVICES="$SERVICES backend"
          [[ "${{ needs.detect-changes.outputs.ai-service }}" == "true" ]] && SERVICES="$SERVICES ai-service"
          [[ "${{ needs.detect-changes.outputs.blog }}" == "true" ]] && SERVICES="$SERVICES blog"
          [[ "${{ needs.detect-changes.outputs.admin }}" == "true" ]] && SERVICES="$SERVICES admin"
          [[ "${{ needs.detect-changes.outputs.gateway }}" == "true" ]] && SERVICES="$SERVICES gateway"

          # 仅 ops/webhook/** 变更 (没有应用镜像需要重建): 退化成 gateway-only 增量
          # 部署. webhook_server.py / deploy.sh 的更新通过 deploy.sh 末尾的
          # `trap _post_deploy_hooks EXIT` 自动 cp 到 /var/lib/aetherblog/webhook/
          # 副本, 再走 sentinel + path-unit 触发 deploy-webhook restart. gateway
          # 重启虽然多余但开销极小 (~3s nginx reload), 比让 webhook 长期运行
          # 在过期代码上要安全得多.
          if [ -z "$SERVICES" ] && \
             [[ "${{ needs.detect-changes.outputs.ops_webhook }}" == "true" ]]; then
            SERVICES="gateway"
          fi

          echo "services=$(echo $SERVICES | xargs)" >> $GITHUB_OUTPUT

      - name: Print deployment info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 增量部署 - 仅重启变更的服务:"
          echo "  📦 ${{ steps.services.outputs.services }}"
          echo "  🛡️ 中间件 (postgres/redis) 不受影响"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Trigger deployment webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          SERVICES: ${{ steps.services.outputs.services }}
        run: |
          set -euo pipefail

          # 构造既要签名也要发送的精确报文 —— 签名必须基于请求体按字节
          # 一致计算（VULN-132 HMAC 要求）。
          body=$(printf '{"services": "%s"}' "$SERVICES")

          # 输出 HMAC-SHA256 十六进制；awk '{print $NF}' 同时兼容两种 openssl
          # 输出格式（"(stdin)= <hex>" 与纯 "<hex>"）。
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $NF}')

          response_file=$(mktemp)
          http_code=$(curl -sS -X POST \
            --noproxy "*" \
            --max-time 900 \
            --connect-timeout 10 \
            --retry 2 \
            --retry-delay 2 \
            --retry-connrefused \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-raw "$body" \
            -o "$response_file" \
            -w "%{http_code}" \
            "$WEBHOOK_URL")

          echo "Webhook HTTP status: $http_code"
          echo "Webhook response:"
          cat "$response_file"

          if [ "$http_code" != "200" ]; then
            echo "❌ Deployment failed, webhook status: $http_code"
            exit 1
          fi

          echo "✅ Deployment completed successfully"
